<!DOCTYPE html>
<html class="light" lang="es">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Brownies 5to Baco</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography,container-queries"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&amp;family=Playfair+Display:ital,wght@0,900;1,900&amp;family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
        rel="stylesheet" />
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#6B4226",
                        secondary: "#D4A373",
                        accent: "#E9EDC9",
                        "background-light": "#FAEDCD",
                        "background-dark": "#2C1810",
                    },
                    fontFamily: {
                        display: ["Playfair Display", "serif"],
                        sans: ["Plus Jakarta Sans", "sans-serif"],
                    },
                },
            },
        };
    </script>
    <style type="text/tailwindcss">
        .scalloped-shape {
            mask-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M100 0C110.8 0 120.4 8.4 130.6 11.2C140.8 14 151.7 11.2 160.7 17.5C169.7 23.8 171.3 35.5 178.4 43.6C185.5 51.7 197.3 56.1 200 66.8C202.7 77.5 194.5 88.3 194.5 100C194.5 111.7 202.7 122.5 200 133.2C197.3 143.9 185.5 148.3 178.4 156.4C171.3 164.5 169.7 176.2 160.7 182.5C151.7 188.8 140.8 186 130.6 188.8C120.4 191.6 110.8 200 100 200C89.2 200 79.6 191.6 69.4 188.8C59.2 186 48.3 188.8 39.3 182.5C30.3 176.2 28.7 164.5 21.6 156.4C14.5 148.3 2.7 143.9 0 133.2C-2.7 122.5 5.5 111.7 5.5 100C5.5 88.3 -2.7 77.5 0 66.8C2.7 56.1 14.5 51.7 21.6 43.6C28.7 35.5 30.3 23.8 39.3 17.5C48.3 11.2 59.2 14 69.4 11.2C79.6 8.4 89.2 0 100 0Z' fill='black'/%3E%3C/svg%3E");
            mask-size: contain;
            mask-repeat: no-repeat;
            mask-position: center;
        }
        .custom-shadow {
            box-shadow: 0 20px 40px -15px rgba(107, 66, 38, 0.2);
        }
        body {
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
    </style>
    <style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>

<body class="bg-background-light dark:bg-background-dark min-h-screen">
    <div class="flex flex-col min-h-screen w-full relative">
        <div class="relative w-full h-[45vh] flex items-center justify-center overflow-hidden">
            <div class="absolute -top-10 -right-10 w-64 h-64 bg-secondary/20 rounded-full blur-3xl"></div>
            <div class="absolute top-20 -left-10 w-48 h-48 bg-primary/10 rounded-full blur-3xl"></div>
            <div class="w-full max-w-sm aspect-square relative z-10 px-6">
                <div class="scalloped-shape w-full h-full bg-secondary flex items-center justify-center p-2">
                    <img alt="Delicious Chocolate Brownie"
                        class="w-full h-full object-cover scalloped-shape transform hover:scale-105 transition-transform duration-700"
                        src="https://lh3.googleusercontent.com/aida-public/AB6AXuAGYFDtXlhNwds9xVM2oo548C97ZjwafBiA5SQ0A8ifXgYJsaz3g8NKTg7isFR-4KYnBX1yaYe29tm0NHuva4I7WGc-GSGn42fg3SguswyplcUHATMyFhyYUf2vWpBUXP-Pt7A_g1NFQOB0x5j_tW9AWv8Oo7C7QdCgnNJwC-drVOGEcjzzPyTQjd0hw311s8zmTrn3aPaIENsjt0vTvCM9eWOsm9cLhatyMck4PoPgeBeVbzgNVAu1_R7jGQxUc47oBaegWoODoPM" />
                </div>
            </div>
            <div class="absolute top-1/4 right-10 bg-white dark:bg-zinc-900 custom-shadow rounded-full p-4 z-20">
                <span class="material-symbols-outlined text-primary dark:text-secondary text-3xl block">star</span>
            </div>
        </div>
        <div
            class="bg-white dark:bg-zinc-900/40 rounded-t-[3.5rem] p-8 flex flex-col gap-8 flex-1 custom-shadow -mt-10 relative z-30">
            <div class="space-y-3 text-center pt-4">
                <h1 class="font-display italic text-7xl text-primary dark:text-secondary leading-none">
                    Brownnies <br /> <span class="text-secondary dark:text-accent">En 5to Baco 8.00 quetzales</span>
                </h1>
                <p class="text-zinc-500 dark:text-zinc-400 font-sans tracking-[0.2em] uppercase text-xs font-bold mt-4">
                    Calidad • 100% Destacable
                </p>
            </div>
            <div class="grid grid-cols-2 gap-4 max-w-sm mx-auto w-full">
                <div
                    class="bg-background-light dark:bg-zinc-800/80 rounded-[2rem] p-6 flex flex-col items-center justify-center text-center">
                    <span class="text-primary dark:text-secondary font-sans font-extrabold text-2xl">39.69g</span>
                    <span class="text-zinc-400 text-[10px] uppercase font-bold tracking-widest mt-1">Peso Neto</span>
                </div>
                <div
                    class="bg-background-light dark:bg-zinc-800/80 rounded-[2rem] p-6 flex flex-col items-center justify-center text-center">
                    <span class="text-primary dark:text-secondary font-sans font-extrabold text-2xl">0</span>
                    <span class="text-zinc-400 text-[10px] uppercase font-bold tracking-widest mt-1">Ventas (por ahora...)</span>
                </div>
            </div>
            <div class="mt-auto space-y-8 max-w-sm mx-auto w-full pb-6">
                <div class="flex flex-col items-center gap-4">
                    <a href="https://docs.google.com/forms/d/e/1FAIpQLScPJv1ZRUHlEPW0UjmJlLp-6-a-s6EptUtgHFcyAIKJa8GU4w/viewform"
                        target="_blank" rel="noopener noreferrer"
                        class="inline-flex items-center gap-3 bg-primary hover:bg-primary/90 text-white px-6 py-3 rounded-full text-2xl font-semibold font-display shadow-md focus:outline-none focus:ring-4 focus:ring-primary/30 transition"
                        aria-label="Enviar sugerencias (abre en nueva pestaña)">
                        <span class="material-symbols-outlined">feedback</span>
                        Sugerencias
                    </a>
                    <div class="flex items-center justify-between px-4 w-full">
                        <button
                            class="w-14 h-14 rounded-full bg-secondary/15 dark:bg-secondary/10 text-primary dark:text-secondary flex items-center justify-center active:scale-90 transition-all">
                            <span class="material-symbols-outlined text-2xl">favorite</span>
                        </button>
                        <div class="flex items-center gap-2">
                            <div class="w-2 h-2 bg-primary rounded-full"></div>
                            <div class="w-2 h-2 bg-primary/20 rounded-full"></div>
                            <div class="w-2 h-2 bg-primary/20 rounded-full"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <button
        class="fixed top-6 right-6 bg-white/80 dark:bg-black/40 backdrop-blur-md text-primary dark:text-white p-4 rounded-full shadow-lg hover:scale-110 active:scale-95 transition-all z-[100]"
        onclick="document.documentElement.classList.toggle('dark')">
        <span class="material-symbols-outlined block dark:hidden">dark_mode</span>
        <span class="material-symbols-outlined hidden dark:block">light_mode</span>
    </button>

</body>

</html>
